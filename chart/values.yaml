# Default values for chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
replicaCount: 1
image:
  repository: null
  tag: stable
  pullPolicy: Always
  secrets:
    - name: gitlab-registry
images:
  web:
    repository: cr.amira.io/nudiplomacy/web/web
  worker:
    repository: cr.amira.io/nudiplomacy/web/worker
  scheduler:
    repository: cr.amira.io/nudiplomacy/web/scheduler
podAnnotations: {}
application:
  track: stable
  tier: web
  secretName:
  secretChecksum:
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
service:
  enabled: true
  annotations: {}
  name: web
  type: ClusterIP
  url: http://my.host.com/
  additionalHosts:
  commonName:
  externalPort: 8000
  internalPort: 8000
ingress:
  tls:
    enabled: true
    secretName: ""
  annotations:
    kubernetes.io/tls-acme: "true"
    kubernetes.io/ingress.class: "nginx"
livenessProbe:
  path: "/_health"
  initialDelaySeconds: 15
  timeoutSeconds: 15
  scheme: "HTTP"
readinessProbe:
  path: "/_health"
  initialDelaySeconds: 5
  timeoutSeconds: 3
  scheme: "HTTP"
resources:
  limits:
    cpu: 200m
    memory: 200Mi
  requests:
    cpu: 100m
    memory: 200Mi

## Configure PodDisruptionBudget
## ref: https://kubernetes.io/docs/concepts/workloads/pods/disruptions/
#
podDisruptionBudget:
  enabled: false
  # minAvailable: 1
  maxUnavailable: 1

workers:
  wrk-games:
    replicaCount: 1
    terminationGracePeriodSeconds: 10
