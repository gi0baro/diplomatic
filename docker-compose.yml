x-env: &env
  POSTGRES_HOST: db
  POSTGRES_DB: diplomatic
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  REDIS_HOST: redis
  WRK_BROKER_URL: redis://redis:6379/1

x-src: &src
  - ./diplomatic:/app/diplomatic
  - ./variants:/app/variants

services:
  db:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: diplomatic

  redis:
    image: docker.io/library/redis:latest

  web:
    build:
      context: .
      target: web
    command: develop --host=0.0.0.0
    environment: *env
    volumes:
      - ./diplomatic:/app/diplomatic
      - ./variants:/app/variants
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  wrk:
    build:
      context: .
      target: worker
    command: worker -l debug
    environment: *env
    volumes: *src
    depends_on:
      - db
      - redis

  wsc:
    build:
      context: .
      target: scheduler
    environment: *env
    volumes: *src
    depends_on:
      - db
      - redis
