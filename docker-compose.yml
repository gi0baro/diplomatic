version: '2.2'

services:
  db:
    image: postgres:9.6
    ports:
      - "5432:5432"
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
  web:
    build: .
    command: weppy -a nudiplomacy run -h 0.0.0.0
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
  celery_wrk:
    build: .
    command: celery worker -l debug -A nudiplomacy:celery
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    environment:
      - C_FORCE_ROOT=true
