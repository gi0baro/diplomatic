# DB settings
db:
  migrate: True
  migrate_enabled: True
  check_reserved: ['common']
# Auth settings
auth:
  server: default
  #formstyle: "divs"
  photo_source: ["gravatar", "facebook", "upload"]
  gender: ["male", "female"]
  registration_requires_verification: False
  registration_requires_approval: False
  #registration_requires_invitation: False
# Mailer
mail:
  server: localhost
  sender: "noreply@answerto.it"
  login: ""
  tls: False
# Redis (mail queue)
redis:
  host: 172.16.42.43
  port: 6379
