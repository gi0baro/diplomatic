stages:
  - test
  - build
  # - deploy

test:
  stage: test
  image: python:3.7-alpine
  # services:
  #   - name: postgres:10-alpine
  #     alias: postgres-ci
  #   - name: redis:latest
  #     alias: redis-ci
  # variables:
  #   POSTGRES_HOST: postgres-ci
  #   POSTGRES_DB: postgres
  #   POSTGRES_USER: postgres
  #   POSTGRES_PASSWORD: postgres
  #   REDIS_HOST: redis-ci
  #   REDIS_PORT: 6379
  before_script:
    - pip install pytest==5.2.2
    # - pip install -r requirements.dev.txt
  script:
    - python -m pytest tests -v -x

build_web:
  stage: build
  image: quay.io/buildah/stable:latest
  variables:
    BUILDAH_FORMAT: docker
    CONTAINER_IMAGE: $CI_REGISTRY_IMAGE/web
  before_script:
    - buildah login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - buildah --storage-driver=vfs bud --file Web.Dockerfile --tag $CONTAINER_IMAGE:$CI_COMMIT_SHORT_SHA
    - buildah --storage-driver=vfs push $CONTAINER_IMAGE:$CI_COMMIT_SHORT_SHA
    - buildah --storage-driver=vfs push $CONTAINER_IMAGE:$CI_COMMIT_SHORT_SHA $CONTAINER_IMAGE:latest
  only:
    refs:
      - master

build_worker:
  stage: build
  image: quay.io/buildah/stable:latest
  variables:
    BUILDAH_FORMAT: docker
    CONTAINER_IMAGE: $CI_REGISTRY_IMAGE/worker
  before_script:
    - buildah login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - buildah --storage-driver=vfs bud --file Wrk.Dockerfile --tag $CONTAINER_IMAGE:$CI_COMMIT_SHORT_SHA
    - buildah --storage-driver=vfs push $CONTAINER_IMAGE:$CI_COMMIT_SHORT_SHA
    - buildah --storage-driver=vfs push $CONTAINER_IMAGE:$CI_COMMIT_SHORT_SHA $CONTAINER_IMAGE:latest
  only:
    refs:
      - master

build_scheduler:
  stage: build
  image: quay.io/buildah/stable:latest
  variables:
    BUILDAH_FORMAT: docker
    CONTAINER_IMAGE: $CI_REGISTRY_IMAGE/scheduler
  before_script:
    - buildah login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - buildah --storage-driver=vfs bud --file Wsc.Dockerfile --tag $CONTAINER_IMAGE:$CI_COMMIT_SHORT_SHA
    - buildah --storage-driver=vfs push $CONTAINER_IMAGE:$CI_COMMIT_SHORT_SHA
    - buildah --storage-driver=vfs push $CONTAINER_IMAGE:$CI_COMMIT_SHORT_SHA $CONTAINER_IMAGE:latest
  only:
    refs:
