deploy:
  stage: deploy
  image: ${CI_REGISTRY}/devops/k8s-deploy/csr1:latest
  variables:
    CI_APPLICATION_TAG: $CI_COMMIT_SHORT_SHA
  script:
    - auto_deploy deploy_chart
  environment:
    name: production
    url: https://diplomacy.c1.svc.amira.io
  only:
    refs:
      - master
