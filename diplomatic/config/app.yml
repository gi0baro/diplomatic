db:
  adapter: postgres
  encoding: utf8
  big_id_fields: yes
langs: ["en", "it"]
site_url: http://localhost:8000
uploads_folder: data/uploads
notifications:
  email_debounce: 10
worker:
  cron:
    manage_games:
      task: diplomatic.tasks.manage_games
      schedule: 60
    fold_stats:
      task: diplomatic.tasks.fold_stats
      crontab:
        minute: 0
        hour: 2
    deliver_notifications:
      task: diplomatic.tasks.deliver_notifications
      schedule: 60
    purge_notifications:
      task: diplomatic.tasks.purge_notifications
      crontab:
        minute: 0
        hour: 2
