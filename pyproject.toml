[project]
name = "diplomatic"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    "emmett[rapidjson]~=2.8.3",
    "emmett-haml",
    "redis~=8.1.0",
    "psycopg2-binary~=2.9.11",
    "pyyaml~=6.0.3",
    "celery",
    "diplomatico",
    "emmett-sentry~=0.10.0",
    "rloop~=0.5.0",
]

[tool.uv.sources]
diplomatico = { path = "./diplomatico", editable = true }

[tool.ruff]
line-length = 120
extend-exclude = ['diplomatic/migrations']

[tool.ruff.format]
quote-style = 'double'

[tool.ruff.lint]
extend-select = [
    # E and F are enabled by default
    'B',      # flake8-bugbear
    'C4',     # flake8-comprehensions
    'C90',    # mccabe
    'I',      # isort
    'N',      # pep8-naming
    'Q',      # flake8-quotes
    'RUF100', # ruff (unused noqa)
    'S',      # flake8-bandit
    'W',      # pycodestyle
]
extend-ignore = [
    'B006', # mutable function args are fine
    'B008', # function calls in args defaults are fine
    'B009', # getattr with constants is fine
    'B023', # lambdas in loops are consumed by ORM queries immediately
    'B034', # re.split won't confuse us
    'B904', # rising without from is fine
    'B905',
    'C408', # dict() calls are fine
    'E711', # ORM query syntax: field == None means IS NULL
    'E712', # ORM query syntax: field == True is the query, not a truth check
    'E731', # assigning lambdas is fine
    'F403', # import * is fine
    'N801', # leave to us class naming
    'N802', # leave to us method naming
    'N806', # leave to us var naming
    'N811', # leave to us var naming
    'N814', # leave to us var naming
    'N818', # leave to us exceptions naming
    'S101', # assert is fine
    'S102', # exec is fine
    'S104', # leave to us security
    'S105', # leave to us security
    'S106', # leave to us security
    'S107', # leave to us security
    'S110', # pass on exceptions is fine
    'S301', # leave to us security
    'S307', # leave to us security
    'S324', # leave to us security
]
mccabe = { max-complexity = 44 }

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2
known-first-party = ['diplomatic', 'tests']

[tool.ruff.lint.per-file-ignores]
'**/__init__.py' = ['E402', 'F401']
'diplomatic/web.py' = ['E402', 'F401']
'tests/**' = ['B017', 'B018', 'E711', 'E712', 'E741', 'F841', 'N803', 'S110', 'S501']

[dependency-groups]
dev = [
    "pytest>=7.4",
    "ruff~=0.15.0",
]
