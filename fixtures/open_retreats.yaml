# The first four phases of `midgame`: stops on the open Spring 1902 retreats, where France's army in
# Burgundy is dislodged (it can retreat to Gascony or disband). To look at a dislodged unit and at a
# retreat order being given, as France.
variant: classic
name: "Open retreats"
players:
  England: tester1
  France: tester2
  Germany: tester3
  Italy: tester4
phases:
  # 1. Spring 1901
  - England: [LON-NTH, EDI-NWG, LVP-YOR]
    France: [BRE-MAO, PAR-BUR, MAR-SPA]
    Germany: [KIE-DEN, BER-KIE, MUN-RUH]
    Italy: [NAP-ION, ROM-APU, VEN-TYR]
  # E: F NTH, F NWG, A YOR  F: F MAO, A BUR, A SPA  G: F DEN, A KIE, A RUH  I: F ION, A APU, A TYR

  # 2. Autumn 1901: England convoys Yorkshire to Norway, France and Germany bounce in Belgium
  - England: [YOR-NWY via, NTH C YOR-NWY]
    France: [MAO-POR, BUR-BEL]
    Germany: [KIE-HOL, RUH-BEL]
    Italy: [ION-TUN, APU-VEN]
  # E: A NWY, F NTH, F NWG  F: F POR, A SPA, A BUR  G: F DEN, A HOL, A RUH  I: F TUN, A VEN, A TYR

  # 3. Winter 1901 builds
  - England: [LON B F]
    France: [BRE B F, MAR B A]
    Germany: [KIE B F, MUN B A]
    Italy: [NAP B F]
  # E: A NWY, F NTH, F NWG, F LON  F: F POR, A SPA, A BUR, F BRE, A MAR
  # G: F DEN, A HOL, A RUH, F KIE, A MUN  I: F TUN, A VEN, A TYR, F NAP

  # 4. Spring 1902: Germany dislodges the army in Burgundy
  - England: [LON-ENG, NTH S LON-ENG, NWG-BAR, NWY-SWE]
    France: [BRE-ENG, POR-MAO, MAR-PIE]
    Germany: [RUH-BUR, MUN S RUH-BUR, HOL-BEL, DEN-SWE]
    Italy: [VEN-PIE, TYR-BOH, NAP-TYS]
  # E: F ENG, F NTH, F BAR, A NWY  F: F BRE, F MAO, A SPA, A MAR, A BUR (dislodged)
  # G: A BUR, A MUN, A BEL, F DEN, F KIE  I: F TUN, A VEN, A BOH, F TYS

# Spring 1902 retreats open
