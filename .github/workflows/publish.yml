name: publish

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/gi0baro/diplomatic

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: commit
        run: echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          platforms: linux/amd64
          build-args: APP_COMMIT=${{ steps.commit.outputs.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.commit.outputs.sha }}
            ${{ env.IMAGE }}:latest
      - name: worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: worker
          platforms: linux/amd64
          build-args: APP_COMMIT=${{ steps.commit.outputs.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
          push: true
          tags: |
            ${{ env.IMAGE }}-wrk:${{ steps.commit.outputs.sha }}
            ${{ env.IMAGE }}-wrk:latest
      - name: scheduler
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: scheduler
          platforms: linux/amd64
          build-args: APP_COMMIT=${{ steps.commit.outputs.sha }}
          cache-from: type=gha,scope=scheduler
          cache-to: type=gha,scope=scheduler,mode=max
          push: true
          tags: |
            ${{ env.IMAGE }}-sched:${{ steps.commit.outputs.sha }}
            ${{ env.IMAGE }}-sched:latest

  deploy:
    runs-on: ubuntu-latest
    needs: publish
    environment:
      name: live
      url: https://diplomatic.live
    permissions: {}
    steps:
      - name: trigger deploy
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.OPS_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/gi0baro/ops/dispatches \
            -d '{"event_type":"deploy_diplomatic-live","client_payload":{"build_tag":"${{ needs.publish.outputs.sha }}"}}'
